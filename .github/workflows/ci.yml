name: CI

on:
  # Every branch push runs CI; feature branches were previously never checked,
  # which is how a credential reached a pushed branch unnoticed.
  push:
    branches: ['**']
  # Pull requests to integrate/** (the v1.7 integration branches) get CI as
  # well as pull requests to main.
  pull_request:
    branches: [main, 'integrate/**']
  # release.yml calls this workflow on the tagged commit and publishes only
  # if it passes. That binds only tags whose commit carries the current
  # release.yml; see docs/releasing.md for the repository settings that
  # cover the rest.
  workflow_call:

permissions:
  contents: read

# A newer push to the same lane/* branch or pull request cancels the older
# run. Every other ref (main, integrate/**, train/*, tags, and any branch added
# later) puts the run id in its group, so no run of it is ever cancelled: a
# shared group would not do, because GitHub cancels a pending run when a newer
# one joins the group even with cancel-in-progress off. A push runs CI on its
# head commit only, so this keeps every pushed head's run, not a run for every
# commit in a multi-commit push.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.ref }}${{
    !(startsWith(github.ref, 'refs/heads/lane/') || startsWith(github.ref, 'refs/pull/'))
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/

      - name: mypy
        run: mypy src/lakebench/

      # Every action in .github/workflows is pinned by SHA and listed in
      # .github/action-runtimes.json with its runs.using value. This reads
      # each action.yml at its pinned SHA and fails if the map has drifted.
      - name: Action runtimes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_action_runtimes.py --verify

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      # One failing Python version must not cancel the other: both results
      # are needed to tell a version-specific failure from a real one.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Coverage is collected on 3.13 only: the floors are checked on one
      # interpreter so line-counting differences between versions do not move
      # the number, and the other entries skip the tracing overhead. The
      # version named here must be in the matrix above, or coverage and the
      # floor check stop silently (tests/test_workflows.py checks this).
      - name: Run unit tests
        run: >-
          pytest tests/ -rs --tb=short --ignore=tests/test_e2e.py --ignore=tests/test_integration.py
          ${{ matrix.python-version == '3.13' && '--cov=lakebench --cov-report=json:coverage-unit.json --cov-report=term:skip-covered' || '' }}

      # Per-file floors on the scoring and metrics code (GOALS P8.3).
      - name: Coverage floors
        if: matrix.python-version == '3.13'
        run: python scripts/check_coverage.py --suite unit coverage-unit.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # gitleaks binary rather than gitleaks-action, which needs a paid licence
      # for organisation repos. Version and checksum are pinned.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      # Scans the checked-out tree, not history: a credential removed from the
      # tree but still in an old commit must be rotated, and history scrubbing
      # is a separate decision.
      - name: Scan working tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1'

  rust:
    name: Rust datagen
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: datagen_rs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master on 2026-09-30 (the action has no release tags)
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: datagen_rs

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --release --locked

  spark-tests:
    name: Spark (executed tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The key adds ci.yml, which names the pyspark version, so this job's
      # cache (with the built pyspark wheel) is not the lint job's.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # The detection, scoring and silver logic is PySpark; these tests run it
      # on a local Spark session instead of inspecting source text.
      - name: Install dependencies
        run: pip install -e ".[dev]" "pyspark==4.0.1" pyarrow

      - name: Run Spark tests
        run: >-
          pytest tests/spark -q -rs
          --cov=src/lakebench/spark/scripts --cov-report=json:coverage-spark.json

      # detection_rules.py is imported by path as a top-level module, so it
      # is measured here and not in the unit job.
      - name: Coverage floors
        run: python scripts/check_coverage.py --suite spark coverage-spark.json

  build:
    name: Build Package
    runs-on: ubuntu-24.04
    needs: [lint, test, secrets, rust, spark-tests]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # No pip cache: it installs only `build`, and would share the lint key.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify wheel installs
        run: pip install dist/*.whl && lakebench version
