name: CI

on:
  # Every branch push runs CI: an unchecked feature branch is how a credential
  # once reached a pushed branch.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # release.yml runs this on the tagged commit before it publishes.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every other ref keeps
# each run.
concurrency:
  group: ci-${{ github.ref }}-${{ startsWith(github.ref, 'refs/pull/') && 'pr' || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check src/ tests/ scripts/ && ruff format --check src/ tests/ scripts/

      - name: mypy
        run: mypy src/lakebench/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: >-
          pytest tests/ -q -n auto --dist loadfile -m "not slow and not e2e and not integration"
          -rfE --ignore=tests/spark --ignore=tests/test_e2e.py --ignore=tests/test_integration.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The binary, not gitleaks-action, which needs a paid licence for
      # organisation repos.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: Scan working tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1'

  rust:
    name: Rust datagen
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: datagen_rs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master on 2026-09-30 (the action has no release tags)
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: datagen_rs

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --release --locked

  build:
    name: Build Package
    runs-on: ubuntu-24.04
    needs: [lint, test, secrets, rust]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: pip install build && python -m build

      # Without the PEP 561 marker, type checkers ignore lakebench's annotations.
      - name: Wheel carries py.typed
        run: >-
          python -c "import glob, zipfile;
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist();
          assert 'lakebench/py.typed' in names, 'py.typed missing from the wheel'"

      - name: Verify wheel installs
        run: pip install dist/*.whl && lakebench version

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # No key pattern, gitleaks finding or held-out seed in the built members.
      - name: Package guard
        run: python scripts/package_guard.py --dist dist
