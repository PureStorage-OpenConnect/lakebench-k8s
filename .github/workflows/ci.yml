name: CI

on:
  # Every branch push runs CI; feature branches were previously never checked,
  # which is how a credential reached a pushed branch unnoticed.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # release.yml calls this workflow on the tagged commit and publishes only
  # if it passes. That binds only tags whose commit carries the current
  # release.yml; see RELEASING.md for the repository settings that
  # cover the rest.
  workflow_call:

permissions:
  contents: read

# A newer push to the same lane/* branch or pull request cancels the older
# run. Every other ref (main, integrate/**, train/*, tags, and any branch added
# later) puts the run id in its group, so no run of it is ever cancelled: a
# shared group would not do, because GitHub cancels a pending run when a newer
# one joins the group even with cancel-in-progress off. A push runs CI on its
# head commit only, so this keeps every pushed head's run, not a run for every
# commit in a multi-commit push.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.ref }}${{
    !(startsWith(github.ref, 'refs/heads/lane/') || startsWith(github.ref, 'refs/pull/'))
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # `make check-fast`, what a contributor runs before pushing: ruff, the
      # format check, mypy and the parallel unit tier without the slow AML
      # statistics tests, under an 8-minute budget (target 5). The first
      # signal: the test legs below run the same unit tier on 3.10 and 3.13.
      - name: make check-fast
        run: python scripts/ci_budget.py --seconds 480 --label "make check-fast" -- make check-fast

      # Every tracked doc, script and top-level .md is linked from the docs
      # index or read by code, tests or CI (tests/test_doc_readers.py runs
      # the same check with its planted cases).
      - name: Docs have readers
        # Runs even when make check-fast fails, so one push reports both.
        if: success() || failure()
        run: python scripts/check_doc_readers.py

      # Every action in .github/workflows is pinned by SHA and listed in
      # .github/action-runtimes.json with its runs.using value. This reads
      # each action.yml at its pinned SHA and fails if the map has drifted.
      - name: Action runtimes
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_action_runtimes.py --verify

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    # A backstop 1.5 times the step budget below; the budget is the signal.
    timeout-minutes: 23
    strategy:
      # One failing Python version must not cancel the other: both results
      # are needed to tell a version-specific failure from a real one.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Coverage is collected on 3.13 only: the floors are checked on one
      # interpreter so line-counting differences between versions do not move
      # the number, and the other entries skip the tracing overhead. The
      # version named here must be in the matrix above, or coverage and the
      # floor check stop silently (tests/test_workflows.py checks this).
      # In parallel (one file per worker), under a 15-minute budget
      # (scripts/ci_budget.py fails the step when it runs over and records the
      # time in the step summary). The AML statistics tests marked slow run in
      # the "AML statistics (slow)" job and the Spark tier in its own job.
      - name: Run unit tests
        run: >-
          python scripts/ci_budget.py --seconds 900 --label "unit tests (Python ${{ matrix.python-version }})" --
          pytest tests/ -n auto --dist loadfile -m "not slow and not e2e and not integration"
          -rs --tb=short --ignore=tests/spark --ignore=tests/test_e2e.py --ignore=tests/test_integration.py
          ${{ matrix.python-version == '3.13' && '--cov=lakebench --cov-report=json:coverage-unit.json --cov-report=term:skip-covered' || '' }}

      # Per-file floors on the scoring and metrics code (GOALS P8.3).
      - name: Coverage floors
        if: matrix.python-version == '3.13'
        run: python scripts/check_coverage.py --suite unit coverage-unit.json

      # The per-file report, kept so a floor can be raised from a measured run.
      - name: Upload coverage report
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-unit
          path: coverage-unit.json
          retention-days: 30
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # gitleaks binary rather than gitleaks-action, which needs a paid licence
      # for organisation repos. Version and checksum are pinned.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      # Scans the checked-out tree, not history: a credential removed from the
      # tree but still in an old commit must be rotated, and history scrubbing
      # is a separate decision.
      - name: Scan working tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1'

  # History scan: every commit reachable from the pushed or merged HEAD
  # (about 2 s), with --remerge-diff so what a merge commit itself changed is
  # scanned (plain `git log -p` shows no diff for merges) and
  # --ignore-gitleaks-allow so an inline allow comment hides nothing. The
  # baseline and the config come from a trusted ref (origin/main first for
  # main, pull requests to main and tags; origin/integrate/v1.5.0 first for
  # everything else; see the Scan history step), never from the scanned
  # branch: gitleaks reads a source tree's own .gitleaksignore, so the scan
  # runs on the git dir from a temp directory. A second pass uses the
  # branch's own config, so a rule a branch adds is enforced at once. A pull
  # request to main uses its own baseline (the owner reviews it), and with no
  # baseline on either ref the tree's own is used once, with a warning. This
  # job runs the branch's own ci.yml, so it catches mistakes; protection on
  # main and the pre-push hook are what stop a deliberate bypass. The job also
  # runs the pre-push hook and baseline tests with the real gitleaks.
  secrets-history:
    name: Secret scan (history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan history
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gitleaks-history"
          mkdir -p "$work"
          ignore="$work/gitleaksignore"
          cfg="$work/gitleaks.toml"
          # The config and baseline come from a trusted ref, never from the
          # branch being scanned, so an allowlist a branch adds to its own
          # .gitleaks.toml cannot hide a finding unnoticed. What goes to main
          # (a push to main, a pull request to main, a release tag) is held to
          # main's config; everything else (integrate/*, train/*, lane/*, pull
          # requests to integrate) to integrate's first, the ref the pre-push
          # hook trusts, then main's. Only the main lane merges to integrate,
          # by policy: integrate has no branch protection, so a direct push
          # to it would be its own trusted config, and train review is the
          # control. An allowlist entry merged to integrate applies to the
          # branches on integrate, and reaches main's pass only through its
          # own pull request to main (see RELEASING.md). A branch can
          # still edit this workflow; review of the pull request is that
          # control.
          # trust-order begin
          to_main=no
          if [ "${EVENT:-}" = "pull_request" ]; then
            [ "${BASE_REF:-}" = "main" ] && to_main=yes
          else
            case "${REF:-}" in
              refs/heads/main | refs/tags/*) to_main=yes ;;
            esac
          fi
          if [ "$to_main" = yes ]; then
            trust_order="origin/main origin/integrate/v1.5.0"
          else
            trust_order="origin/integrate/v1.5.0 origin/main"
          fi
          # trust-order end
          echo "trusted refs, first that has the file wins: $trust_order"
          cfg_ref=""
          for ref in $trust_order; do
            if git cat-file -e "$ref:.gitleaks.toml" 2>/dev/null; then
              cfg_ref="$ref"
              break
            fi
          done
          trusted=""
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            echo "::warning::pull request to main: its own baseline is used; the owner reviews it"
            if git cat-file -e origin/main 2>/dev/null; then
              echo "baseline and config changes against origin/main:"
              git diff origin/main HEAD -- .gitleaksignore .gitleaks.toml || true
            fi
          else
            for ref in $trust_order; do
              if git cat-file -e "$ref:.gitleaksignore" 2>/dev/null; then
                trusted="$ref"
                break
              fi
            done
            [ -n "$trusted" ] || echo "::warning::no trusted ref has a .gitleaksignore yet; using this tree's"
          fi
          if [ -n "$trusted" ]; then
            git show "$trusted:.gitleaksignore" >"$ignore"
            echo "baseline from $trusted"
          else
            cp .gitleaksignore "$ignore" 2>/dev/null || : >"$ignore"
          fi
          if [ -n "$cfg_ref" ]; then
            git show "$cfg_ref:.gitleaks.toml" >"$cfg"
            echo "config from $cfg_ref"
          else
            cp .gitleaks.toml "$cfg"
          fi
          # Commits (merge commits' own changes included), commit messages and
          # tag messages; fails if gitleaks scanned nothing.
          scan="$PWD/scripts/gitleaks_history.py"
          for config in "$cfg" "$PWD/.gitleaks.toml"; do
            echo "scanning with $config"
            python "$scan" --repo . --config "$config" --ignore "$ignore"
          done

      - name: Pre-push hook and baseline tests
        env:
          LB_REQUIRE_GITLEAKS: "1"
        run: |
          pip install -e ".[dev]"
          pytest tests/test_pre_push_hook.py tests/test_gitleaks_baseline.py tests/test_gitleaks_history.py -rs --tb=short
          pytest tests/test_release_gate.py -k gitleaks_history -rs --tb=short

  rust:
    name: Rust datagen
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: datagen_rs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master on 2026-09-30 (the action has no release tags)
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: datagen_rs

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --release --locked

  # Each pyspark leg runs the Spark tier forward and in reverse order, and
  # each (leg, order) pass is split into two shards by test file
  # (--lb-shard K/2, tests/spark/conftest.py): eight parallel jobs. Every file
  # is in exactly one shard of each pass, balanced on the recorded times in
  # tests/spark/shard_weights.json, and the reverse jobs run their shard's
  # tests backwards. The order check still runs every test after and before
  # the other files of its shard, but no longer next to a file in the other
  # shard; a job that turns red right after the weights change and move files
  # between shards points at an order dependency. One unsharded pass of 381
  # tests took 30 to 52 min on 2026-10-02 (37011145001, 37020573180); by
  # 2026-10-03 the tier had 455 tests (collected at a5923850) and Spark jobs in train runs failed
  # only on the 70-minute budget (4239 to 4265 s; 37139482365, 37145033026).
  # Sharded, the test step took (shard 1, shard 2, in seconds): 4.0 forward
  # 1307, 2096 and 2283, 2005; 4.0 reverse 1064, 1943 and (runner shut down
  # at 1583), 1935; 4.1 forward 2000, 2073 and 2037, 2128; 4.1 reverse 2047,
  # 2034 and 1498, 2034 (37153895161, 37156481202). The same shard took 1307
  # and 2283 s on two runners. On the 4.1 line the split is within 3% of an
  # even one; on the 4.0 line it is not (one weight per file serves both
  # lines). The budget is 52 minutes (scripts/ci_budget.py), 37% above the
  # slowest shard seen, with timeout-minutes 78 as the backstop.
  # Coverage is collected on the two 4.0 forward shards and combined in the
  # "Spark coverage floors" job below. Each job keeps its JUnit report, the
  # input of scripts/spark_shard_weights.py.
  spark-tests:
    name: Spark (pyspark ${{ matrix.pyspark }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 78
    strategy:
      fail-fast: false
      matrix:
        pyspark: ["4.1.1"]
        shard: [1, 2]
        include:
          - pyspark: "4.1.1"
            leg: "4.1"
    env:
      COVERAGE_FILE: coverage-spark-${{ matrix.shard }}.data
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The key adds ci.yml, which names the pyspark versions, so this job's
      # cache (with the built pyspark wheels) is not the lint job's.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # The jars change only with the lock, so the key does too. Restore and
      # save are separate steps so a red leg still saves the jars it fetched.
      - name: Restore the test jar cache
        id: jar-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lakebench-test-jars
          key: test-jars-${{ matrix.leg }}-${{ hashFiles('tests/spark/jars.lock.json') }}

      # The detection, scoring and silver logic is PySpark; these tests run it
      # on a local Spark session instead of inspecting source text.
      - name: Install dependencies
        run: pip install -e ".[dev]" "pyspark==${{ matrix.pyspark }}" pyarrow

      # The Iceberg and Delta jars pinned in tests/spark/jars.lock.json,
      # checked by sha256.
      - name: Fetch the test jars
        id: fetch
        run: python scripts/fetch_test_jars.py --leg ${{ matrix.leg }} --print-env >> "$GITHUB_ENV"

      - name: Save the test jar cache
        if: steps.fetch.outcome == 'success' && steps.jar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lakebench-test-jars
          key: test-jars-${{ matrix.leg }}-${{ hashFiles('tests/spark/jars.lock.json') }}

      - name: Run Spark tests
        run: >-
          python scripts/ci_budget.py --seconds 1800
          --label "Spark tests (pyspark ${{ matrix.pyspark }}, ${{ matrix.shard }}/2)" --
          pytest tests/spark -q -rsxX -p no:cacheprovider -n 2 --dist loadfile
          --basetemp="${{ runner.temp }}/spark"
          --junitxml="${{ runner.temp }}/spark-junit.xml"
          --cov=src/lakebench/spark/scripts --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-spark-data-${{ matrix.shard }}
          overwrite: true
          path: coverage-spark-${{ matrix.shard }}.data
          retention-days: 7
          if-no-files-found: error

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spark-junit-${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/spark-junit.xml
          retention-days: 30
          if-no-files-found: ignore

  # The Spark coverage floors (scripts/check_coverage.py --suite spark) on the
  # two 4.0 forward shards' coverage data combined, which is the same set of
  # tests one unsharded 4.0 forward pass measured. The coverage version is
  # the one pinned in pyproject.toml (tests/test_workflows.py checks this).
  # It runs when a Spark job failed too, so a coverage drop is still reported
  # while another leg is red; a 4.0 forward shard that failed uploads no data
  # and the combine step then fails.
  spark-coverage:
    name: Spark coverage floors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [spark-tests]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # No pip cache: it installs only coverage, and would share the lint key.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install coverage
        run: pip install "coverage==7.13.2"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-spark-data-*
          merge-multiple: true
          path: coverage-data

      # Both shards' data must be there: a missing one would lower, not
      # fail, the numbers of the files only it reached.
      - name: Combine the shards' coverage
        run: |
          test -f coverage-data/coverage-spark-1.data
          test -f coverage-data/coverage-spark-2.data
          coverage combine --data-file=coverage-spark.data coverage-data/coverage-spark-1.data coverage-data/coverage-spark-2.data
          coverage json --data-file=coverage-spark.data -o coverage-spark.json

      - name: Coverage floors
        run: python scripts/check_coverage.py --suite spark coverage-spark.json

      # The per-file report, kept so a floor can be raised from a measured run.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-spark
          overwrite: true
          path: coverage-spark.json
          retention-days: 30
          if-no-files-found: ignore

  # The AML statistics tests marked `slow` (the heavy fidelity-gate fits, the
  # scale invariance check, and the Spark fidelity gate over silver), on the
  # pinned reference libraries. It runs on every push to main, integrate/**,
  # train/* (the merge trains, so a red result stops the train before
  # integrate moves) and tags (so also in the release's ci call, where
  # github.event_name is the caller's `push`), and on every pull request to
  # integrate/** or main (a skipped job would satisfy a required check on the
  # integrate-to-main pull request). A selection that finds no test exits 5, so the job cannot
  # pass having run nothing.
  aml-slow:
    name: AML statistics (slow)
    if: >-
      github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/heads/integrate/')
      || startsWith(github.ref, 'refs/heads/train/')
      || startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'integrate/'))
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -e ".[dev]" "pyspark==4.0.1"

      - name: Slow unit tests
        run: >-
          pytest tests/ -rs --tb=short -m "slow and not e2e and not integration"
          --ignore=tests/spark --ignore=tests/test_e2e.py --ignore=tests/test_integration.py

      - name: Slow Spark tests
        run: pytest tests/spark -rs --tb=short -m slow

      # test_power_sim_output_hash_is_recorded reruns the D8 power simulation
      # and compares its output hash with the one the pre-registration records.
      # That hash was produced with other numpy and scipy versions than the
      # [aml] pins, so above it skips. Here it runs in a second venv with the
      # recorded versions (read from the pre-registration), and the skip is a
      # failure.
      - name: Power simulation hash (recorded numpy and scipy)
        env:
          LB_REQUIRE_POWER_SIM_HASH: "1"
        run: |
          versions=$(python - <<'PY'
          import json
          p = json.load(open("src/lakebench/spark/data/aml/aml_preregistration.json"))
          w = p["scale_invariance"]["power_sim"]["produced_with"]
          print(f"numpy=={w['numpy']} scipy=={w['scipy']}")
          PY
          )
          echo "installing $versions"
          python -m venv "$RUNNER_TEMP/powersim"
          "$RUNNER_TEMP/powersim/bin/pip" install -q -e ".[dev]"
          "$RUNNER_TEMP/powersim/bin/pip" install -q $versions
          "$RUNNER_TEMP/powersim/bin/python" -m pytest tests/test_aml_scale_invariance.py -rs \
            --tb=short -k test_power_sim_output_hash_is_recorded

  build:
    name: Build Package
    runs-on: ubuntu-24.04
    needs: [lint, test, secrets, secrets-history, rust, spark-tests, spark-coverage]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # No pip cache: it installs only `build`, and would share the lint key.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      # PEP 561 marker; without it type checkers ignore lakebench's annotations.
      - name: Wheel carries py.typed
        run: >-
          python -c "import glob, zipfile;
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist();
          assert 'lakebench/py.typed' in names, 'py.typed missing from the wheel'"

      - name: Verify wheel installs
        run: pip install dist/*.whl && lakebench version

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # What the built artifacts and the script maps rendered from the wheel
      # carry: no local-only docs, no key patterns or gitleaks finding (the
      # generated members, PKG-INFO, METADATA, RECORD and _build_info.py,
      # are not in the tree the secret-scan jobs read), and no held-out seed
      # once the hash file exists (PENDING-OA5 passes here; the release
      # gate's --require-all refuses it).
      - name: Package guard
        run: python scripts/package_guard.py --dist dist

      # Named ci-dist, not dist: release.yml calls this workflow in the same
      # run and uploads its own dist, and artifact names are per run.
      - name: Upload the wheel for the clean-venv job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-dist
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error

  # The wheel in a fresh venv, with nothing from the repository or the dev
  # extra around it: once alone, so a runtime import of a package that is not
  # a dependency fails here, and once with [aml], whose six numeric pins must
  # install as REFERENCE_PY_DEPS names them on both ends of the supported
  # Python range.
  clean-venv:
    name: Clean-venv install (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-dist
          path: dist

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wheel alone
        run: |
          python -m venv "$RUNNER_TEMP/plain"
          "$RUNNER_TEMP/plain/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/plain/bin/lakebench" version
          "$RUNNER_TEMP/plain/bin/lakebench" --help > /dev/null
          "$RUNNER_TEMP/plain/bin/lakebench" init --no-interactive --name smoke -o "$RUNNER_TEMP/smoke.yaml"
          test -s "$RUNNER_TEMP/smoke.yaml"
          "$RUNNER_TEMP/plain/bin/python" - <<'PY'
          # Every module, so a module-level import of an undeclared package
          # fails here. spark/scripts has no __init__.py, so the walk does not
          # reach the driver-pod scripts, which import pyspark.
          import importlib
          import pkgutil
          from pathlib import Path

          import lakebench

          names = [m.name for m in pkgutil.walk_packages(lakebench.__path__, "lakebench.")]
          for name in names:
              importlib.import_module(name)
          assert len(names) > 100, names
          print(f"imported {len(names)} modules")

          # Package data the commands read at run time.
          pkg = Path(lakebench.__file__).parent
          assert len(list((pkg / "templates").rglob("*.j2"))) > 20, "templates missing"
          assert len(list((pkg / "spark" / "scripts").glob("*.py"))) > 10, "Spark scripts missing"
          for rel in (
              "config/datagen_lineage.yaml",
              "config/validated_combinations.yaml",
              "spark/data/aml/aml_preregistration.json",
              "py.typed",
          ):
              assert (pkg / rel).is_file(), f"{rel} missing from the wheel"
          PY

      - name: Wheel with the aml extra
        run: |
          python -m venv "$RUNNER_TEMP/aml"
          "$RUNNER_TEMP/aml/bin/pip" install "$(ls dist/*.whl)[aml]"
          "$RUNNER_TEMP/aml/bin/lakebench" version
          "$RUNNER_TEMP/aml/bin/python" - <<'PY'
          import importlib.metadata as md

          import pyarrow  # noqa: F401  (fidelity_gate's parquet engine)
          import sklearn.ensemble  # noqa: F401

          import lakebench.aml.fidelity_gate  # noqa: F401
          import lakebench.aml.reference_score  # noqa: F401
          from lakebench.modules.pipeline_engines.spark.job import REFERENCE_PY_DEPS

          # The six whose version changes a reference-model number (CHECKED in
          # tests/test_reference_pins.py); the other four pins are helpers.
          pins = dict(spec.split("==") for spec in REFERENCE_PY_DEPS)
          for name in ("numpy", "scipy", "pandas", "scikit-learn", "joblib", "threadpoolctl"):
              got = md.version(name)
              assert got == pins[name], f"{name} {got} installed, REFERENCE_PY_DEPS pins {pins[name]}"
              print(f"{name}=={got}")
          PY

  # The quick path of CONTRIBUTING.md, run as written in a clean container
  # (scripts/contributor_path.py turns its one clone line into a clone of
  # the commit under test). It includes `make test-spark`, so it is outside
  # the fast-path budgets and runs only where the path can have changed:
  # every push to main, integrate/** and train/*, tags (so a release's call
  # waits for it), and any other push or pull request that touches one of
  # the script's INPUTS; otherwise its steps are skipped and the step
  # summary says so. Do not make it a required check: a skipped run is
  # green. Nothing here is cached, so every run downloads pyspark and the
  # jars. The backstop is the slowest Spark pass plus check-fast and the
  # installs; build does not wait for this job.
  contributor-path:
    name: Contributor path
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container:
      image: python:3.11-bookworm@sha256:3fd8382c50bae84184460a6e1a8ff4eeac0e3ca6a560691cb56bd84d2b6ec9ca
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Changed inputs
        id: inputs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # On its own line so a crash fails the step instead of skipping
          # the quick path with a green job.
          run="$(python3 scripts/contributor_path.py --should-run)"
          case "$run" in
            true) ;;
            false) echo "Skipped: no quick-path input changed on this ref." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::--should-run printed '$run'"; exit 1 ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install Java 17 and make
        if: steps.inputs.outputs.run == 'true'
        run: |
          set -euo pipefail
          apt-get update -q
          apt-get install -y -q --no-install-recommends openjdk-17-jre-headless make git

      - name: Run the quick path
        if: steps.inputs.outputs.run == 'true'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/contributor_path.py > "$RUNNER_TEMP/quick-path.sh"
          cat "$RUNNER_TEMP/quick-path.sh"
          work="$(mktemp -d)"
          cd "$work"
          bash -euo pipefail "$RUNNER_TEMP/quick-path.sh"
