name: Release gate

# Called by release.yml (PyPI) and binary.yml (GitHub Release) on a v* tag.
# Both publish only when every job here passes, so a tag cannot reach one
# channel and not the other.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-tag:
    name: Tag is on main and matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} (${commit}) is not on main; merge first, then tag"
            exit 1
          fi

      - name: Tag matches the package version
        run: python scripts/check_version.py --tag "${GITHUB_REF_NAME}"

  gate:
    name: scripts/release_gate.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: datagen_rs

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # --require-all: a check that cannot run (a missing tool) fails the
      # release instead of being skipped.
      - name: Release gate
        run: python scripts/release_gate.py --tag "${GITHUB_REF_NAME}" --require-all
