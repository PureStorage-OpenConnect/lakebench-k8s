name: Release

# One workflow per v* tag, in this order:
#
#   ci -> verify-tag + gate -> build-dist + build-binary -> github-release -> publish (PyPI)
#
# The GitHub Release is created before the PyPI upload, so a version on PyPI
# always has its binaries; if the upload fails the tag has binaries only and
# the publish job can be re-run.
#
# These gates bind only a tag whose own commit carries this file. A tag
# pushed on an older commit runs that commit's release workflow, which may
# have no gates. Protection against that lives in repository settings (a
# required reviewer on the pypi environment and a v* tag ruleset); see
# docs/releasing.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  verify-tag:
    name: Tag is on main and matches the version
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # GITHUB_SHA is the commit this run checked out and tested. The tag ref
      # can be moved after the push, so it is not what gets checked.
      - name: Tested commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main; merge first, then tag"
            exit 1
          fi

      - name: Install packaging
        run: pip install packaging

      - name: Tag matches the package version
        run: python scripts/check_version.py --tag "${GITHUB_REF_NAME}"

  # The gate's lint, type, test, Rust and secret-scan checks already ran in
  # the ci job on this commit, so only the release-only checks run here.
  # --require-all makes a check that cannot run fail the release.
  gate:
    name: Release gate
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Release gate (release-only checks)
        run: >-
          python scripts/release_gate.py --tag "${GITHUB_REF_NAME}" --require-all
          --only examples,version,changelog,em-dashes,uat-results

  build-dist:
    name: Build wheel and sdist
    needs: [verify-tag, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: pip install build && python -m build

      - name: Verify wheel installs
        run: pip install dist/*.whl && lakebench version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  build-binary:
    name: Build binary (${{ matrix.os }})
    needs: [verify-tag, gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux-amd64
            runner: ubuntu-latest
          - os: macos-amd64
            runner: macos-latest
          - os: macos-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[build]"

      - name: Build binary
        run: pyinstaller lakebench.spec

      - name: Smoke test
        run: |
          ./dist/lakebench version
          ./dist/lakebench --help
          ./dist/lakebench init --name smoketest -o /tmp/smoke.yaml
          test -f /tmp/smoke.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: lakebench-${{ matrix.os }}
          path: dist/lakebench

  github-release:
    name: Create GitHub Release
    needs: [build-dist, build-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lakebench-*
          path: artifacts

      - name: Rename binaries
        run: |
          for dir in artifacts/lakebench-*; do
            os=$(basename "$dir" | sed 's/lakebench-//')
            mv "$dir/lakebench" "lakebench-${os}"
          done
          ls -la lakebench-*

      - uses: softprops/action-gh-release@v2
        with:
          files: lakebench-*
          generate_release_notes: true

  publish:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/lakebench-k8s
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
