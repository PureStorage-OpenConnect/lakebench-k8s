name: Release to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # 1.5.0 reached PyPI from a commit that was never merged and never passed CI,
  # because this workflow only ran ruff and pytest. Publishing now needs the
  # full CI workflow green on the tagged commit, the tag reachable from main,
  # and scripts/release_gate.py passing (release-gate.yml).
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  release-gate:
    name: Release gate
    uses: ./.github/workflows/release-gate.yml

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ci, release-gate]
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/lakebench-k8s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify wheel installs
        run: pip install dist/*.whl && lakebench version

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
