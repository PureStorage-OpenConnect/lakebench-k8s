name: Release

# One workflow per v* tag, in this order:
#
#   ci -> verify-tag + gate -> build-dist + build-binary-{linux,macos} -> github-release
#      -> publish (PyPI)
#
# github-release and publish run only in the upstream repository. On a fork
# they are skipped and release-dry-run downloads the same artifacts, lists
# them, writes SHA256SUMS and runs install.sh against them, so a tag on a fork
# exercises the build and the artifact round trip without writing a release
# or uploading anywhere.
# There is deliberately no workflow_dispatch trigger: a manual run in the
# upstream repository would reach publish.
#
# The GitHub Release is created before the PyPI upload, so a version on PyPI
# always has its binaries; if the upload fails the tag has binaries only and
# the publish job can be re-run.
#
# These gates bind only a tag whose own commit carries this file. A tag
# pushed on an older commit runs that commit's release workflow, which may
# have no gates. Protection against that lives in repository settings (a
# required reviewer on the pypi environment and a v* tag ruleset); see
# docs/releasing.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  verify-tag:
    name: Tag is on main and matches the version
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # GITHUB_SHA is the commit this run checked out and tested. The tag ref
      # can be moved after the push, so it is not what gets checked.
      - name: Tested commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main; merge first, then tag"
            exit 1
          fi

      - name: Install packaging
        run: pip install packaging

      - name: Tag matches the package version
        run: python scripts/check_version.py --tag "${GITHUB_REF_NAME}"

  # The gate's lint, type, test, Rust and secret-scan checks already ran in
  # the ci job on this commit, so only the release-only checks run here.
  # --require-all makes a check that cannot run fail the release.
  gate:
    name: Release gate
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Release gate (release-only checks)
        run: >-
          python scripts/release_gate.py --tag "${GITHUB_REF_NAME}" --require-all
          --only examples,version,changelog,em-dashes,uat-results

  build-dist:
    name: Build wheel and sdist
    needs: [verify-tag, gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Build
        run: pip install build && python -m build

      - name: Verify wheel installs
        run: pip install dist/*.whl && lakebench version

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: dist/

  # RHEL 8 (glibc 2.28) is the oldest platform lakebench supports, and a
  # binary runs only on a glibc at least as new as the one it was built
  # against, so the Linux binary is built on Rocky Linux 8 rather than on the
  # runner's Ubuntu (glibc 2.39). RHEL 8's python3.11 is built with a shared
  # libpython, which PyInstaller needs; the manylinux images' Pythons are not.
  build-binary-linux:
    name: Build binary (linux-amd64, glibc 2.28)
    needs: [verify-tag, gate]
    runs-on: ubuntu-24.04
    container: rockylinux:8
    steps:
      - name: Install build tools
        run: dnf install -y python3.11 python3.11-pip python3.11-devel git binutils

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install dependencies
        run: python3.11 -m pip install -e ".[build]"

      - name: Build binary
        run: python3.11 -m PyInstaller lakebench.spec

      # objdump sees the PyInstaller bootloader; the libraries it unpacks at
      # run time come from this same Rocky 8 build root.
      - name: Smoke test and glibc ceiling
        run: |
          ./dist/lakebench version
          ./dist/lakebench --help
          ./dist/lakebench init --name smoketest -o /tmp/smoke.yaml
          test -f /tmp/smoke.yaml
          need="$(objdump -T dist/lakebench | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)"
          if [ -z "$need" ]; then
            echo "::error::could not read GLIBC symbol versions from the binary"
            exit 1
          fi
          echo "binary requires glibc ${need}"
          if [ "$(printf '%s\n2.28\n' "$need" | sort -V | tail -1)" != "2.28" ]; then
            echo "::error::binary needs glibc ${need}, newer than RHEL 8's 2.28"
            exit 1
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lakebench-linux-amd64
          path: dist/lakebench

  build-binary-macos:
    name: Build binary (${{ matrix.os }})
    needs: [verify-tag, gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # macos-latest is arm64; the Intel binary needs an Intel runner.
          - os: macos-amd64
            runner: macos-15-intel
            arch: x86_64
          - os: macos-arm64
            runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[build]"

      - name: Build binary
        run: pyinstaller lakebench.spec

      - name: Smoke test and architecture
        env:
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          ./dist/lakebench version
          ./dist/lakebench --help
          ./dist/lakebench init --name smoketest -o /tmp/smoke.yaml
          test -f /tmp/smoke.yaml
          got="$(lipo -archs dist/lakebench)"
          echo "binary architectures: ${got}"
          if [ "$got" != "$WANT_ARCH" ]; then
            echo "::error::expected a ${WANT_ARCH}-only binary, got: ${got}"
            exit 1
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lakebench-${{ matrix.os }}
          path: dist/lakebench

  github-release:
    name: Create GitHub Release
    needs: [build-dist, build-binary-linux, build-binary-macos]
    if: github.repository == 'PureStorage-OpenConnect/lakebench-k8s'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: lakebench-*
          path: artifacts

      - name: Rename binaries
        run: |
          for dir in artifacts/lakebench-*; do
            os=$(basename "$dir" | sed 's/lakebench-//')
            mv "$dir/lakebench" "lakebench-${os}"
          done
          ls -la lakebench-*

      # install.sh downloads this file from the same release and refuses a
      # binary whose checksum does not match it.
      - name: Write SHA256SUMS
        run: |
          sha256sum lakebench-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3 || { echo "::error::SHA256SUMS does not list 3 binaries"; exit 1; }

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            lakebench-*
            SHA256SUMS
          generate_release_notes: true

  publish:
    name: Publish to PyPI
    needs: github-release
    if: github.repository == 'PureStorage-OpenConnect/lakebench-k8s'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/lakebench-k8s
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (the release/v1 branch on 2026-09-30)

  # Forks only. Same downloads, rename and SHA256SUMS as github-release and
  # publish, then a listing, and install.sh run against those files served
  # the way the release serves them, so a fork tag exercises the download,
  # checksum and install path end to end.
  release-dry-run:
    name: Release dry run (fork)
    needs: [build-dist, build-binary-linux, build-binary-macos]
    if: github.repository != 'PureStorage-OpenConnect/lakebench-k8s'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Only for install.sh; checked out to repo/ so the downloads below stay
      # at the job root as in github-release.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: repo

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: lakebench-*
          path: artifacts

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: List downloads
        run: ls -R artifacts dist

      - name: Rename binaries
        run: |
          for dir in artifacts/lakebench-*; do
            os=$(basename "$dir" | sed 's/lakebench-//')
            mv "$dir/lakebench" "lakebench-${os}"
          done
          ls -la lakebench-*

      - name: Expected files and checksums
        run: |
          for f in lakebench-linux-amd64 lakebench-macos-amd64 lakebench-macos-arm64; do
            test -s "$f" || { echo "::error::missing release binary $f"; exit 1; }
          done
          ls dist/*.whl dist/*.tar.gz
          sha256sum lakebench-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3 || { echo "::error::SHA256SUMS does not list 3 binaries"; exit 1; }
          sha256sum dist/*

      # The release layout is <base>/<tag>/<asset>; install.sh reads
      # LB_INSTALL_BASE_URL in place of the GitHub download base.
      - name: install.sh round trip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "srv/${TAG}" "${RUNNER_TEMP}/lb-bin"
          cp lakebench-* SHA256SUMS "srv/${TAG}/"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory srv &
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:8765/ && break
            sleep 1
          done
          curl -fs -o /dev/null http://127.0.0.1:8765/ \
            || { echo "::error::the local http.server did not start"; exit 1; }
          INSTALL_DIR="${RUNNER_TEMP}/lb-bin" VERSION="${TAG}" \
            LB_INSTALL_BASE_URL=http://127.0.0.1:8765 bash repo/install.sh
          cmp "${RUNNER_TEMP}/lb-bin/lakebench" lakebench-linux-amd64
