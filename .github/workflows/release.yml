name: Release to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # 1.5.0 reached PyPI from a commit that was never merged and never passed CI,
  # because this workflow only ran ruff and pytest. Publishing now needs the
  # full CI workflow green on the tagged commit and the tag reachable from main.
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  verify-tag:
    name: Tag is on main and matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} (${commit}) is not on main; merge first, then tag"
            exit 1
          fi

      - name: Tag matches the package version
        run: python scripts/check_version.py --tag "${GITHUB_REF_NAME}"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ci, verify-tag]
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/lakebench-k8s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify wheel installs
        run: pip install dist/*.whl && lakebench version

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
