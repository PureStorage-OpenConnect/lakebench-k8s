# examples/polaris-iceberg-spark-trino.yaml at v1.6.0 (b774dad1), for tests/test_init_from.py.
# Recipe: polaris-iceberg-spark-trino
#
# Apache Polaris REST catalog + Iceberg + Spark pipeline + Trino query engine.
# Polaris replaces Hive Metastore with a modern REST catalog (port 8181).
#
# Deploys: namespace, S3 secrets, PostgreSQL, Polaris server + bootstrap job,
#          Spark RBAC, Trino (coordinator + workers).
#
# Requirements:
#   - Polaris minimum version: 1.6.0 (earlier versions have STS bug)
#   - FlashBlade / non-AWS S3: the deployer bootstraps each catalog with
#     `stsUnavailable: true` and `pathStyleAccess: true` in the storage
#     config. No server-wide feature flag is required or supported.
#   - Trino 479+ needed for iceberg.rest-catalog.oauth2.scope support

name: polaris-iceberg-trino
recipe: polaris-iceberg-spark-trino

images:
  spark: apache/spark:4.0.2-python3
  postgres: postgres:17
  polaris: apache/polaris:1.6.0
  polaris_admin_tool: apache/polaris-admin-tool:1.6.0
  trino: trinodb/trino:483
  pull_policy: Always

platform:
  kubernetes:
    namespace: polaris-iceberg-trino
    create_namespace: true

  storage:
    s3:
      endpoint: <YOUR_S3_ENDPOINT>          # e.g. http://10.0.0.1:80
      region: us-east-1
      path_style: true                       # required for FlashBlade / MinIO
      access_key: <YOUR_S3_ACCESS_KEY>
      secret_key: <YOUR_S3_SECRET_KEY>
      buckets:
        bronze: polaris-iceberg-trino-bronze
        silver: polaris-iceberg-trino-silver
        gold: polaris-iceberg-trino-gold

    scratch:
      enabled: true
      storage_class: <YOUR_SCRATCH_STORAGE_CLASS>  # Portworx: px-csi-scratch (repl=1)

  compute:
    postgres:
      storage: 10Gi
      storage_class: <YOUR_DB_STORAGE_CLASS>       # Portworx: px-csi-db (repl=3)

architecture:
  catalog:
    type: polaris
    polaris:
      # Required. Each install must set its own OAuth2 client secret (LB-090):
      # `deploy`, `run` and `destroy` each reload the config, so they must
      # agree on the same value. Generate one with
      #   python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
      # then export it as LAKEBENCH_POLARIS_CLIENT_SECRET before running any
      # lakebench command. The env-var pattern avoids committing the secret
      # by accident and matches the other polaris-*.yaml examples.
      client_secret: ${LAKEBENCH_POLARIS_CLIENT_SECRET}

  pipeline:
    mode: batch

  query_engine:
    type: trino
    trino:
      coordinator:
        cpu: "2"
        memory: 8Gi
      worker:
        replicas: 2
        cpu: "4"
        memory: 16Gi
        spill_enabled: true
        spill_max_per_node: 40Gi
        storage: 50Gi
        storage_class: ""

workload:
  schema: customer360
  datagen:
    scale: 1                  # ~10 GB bronze data
    file_size: 64mb
    timestamp_start: "2024-01-01"
    timestamp_end: "2025-01-01"
