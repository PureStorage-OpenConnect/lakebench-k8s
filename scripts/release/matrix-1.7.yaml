# Release matrix 1.7.0: the rows of the SPEC section 11 table, one
# deployment each, scale 1 unless noted. The Spark minor and table format
# version of every row come from
# lakebench.metrics.release_record.RELEASE_MATRIX_VERSIONS; the harness
# refuses a row whose generated config resolves to other versions, and
# refuses a row that is not in RELEASE_MATRIX. Seeds: Customer 360 42,
# AML 43 (the development seed). extra_steps run on the row's own
# deployment after its run and before its destroy: continuous-after-batch is
# a continuous run that must reset the batch's state and pass.
version: 1.7.0
rows:
