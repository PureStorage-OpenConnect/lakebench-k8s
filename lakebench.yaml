# Lakebench configuration
# ========================
# This file defines a Lakebench deployment. It is the default config the CLI
# picks up when no `--config` is passed (`lakebench deploy` and friends look
# for `./lakebench.yaml`). Change it in place or copy it next to your run.
#
# Convention:
#   Uncommented fields  = values you set (or the deployment name, which is
#                         required).
#   # field: value      = the schema default. Leaving the line commented keeps
#                         the default active; you do not need to uncomment it
#                         to "enable" the default.
#   ## Section header   = a comment banner, not a config field.
#
# Commenting an optional section out does NOT disable it; Pydantic fills in
# defaults. To turn something off, set its `enabled` or `install` flag to
# `false` explicitly.
#
# Recipe guide:      docs/recipes.md
# Full reference:    docs/configuration.md
# Polaris quickstart: docs/quickstart-polaris.md
#
# Minimum viable config (four fields):
#   name: my-lakehouse
#   recipe: polaris-iceberg-spark-trino   # or another recipe from docs/recipes.md
#   platform.storage.s3.endpoint: http://your-s3:80
#   platform.storage.s3.access_key / secret_key: your-credentials
# Everything else has sensible defaults.

# REQUIRED: unique name for this deployment (also used as the K8s namespace)
name: my-lakehouse

# Recipe shorthand -- sets catalog + table_format + engine + query_engine in
# one line.
# Valid recipes:
#   default (alias for hive-iceberg-spark-trino)
#   hive-iceberg-spark-trino, hive-iceberg-spark-thrift,
#     hive-iceberg-spark-duckdb, hive-iceberg-spark-none
#   polaris-iceberg-spark-trino, polaris-iceberg-spark-thrift,
#     polaris-iceberg-spark-duckdb, polaris-iceberg-spark-none
#   hive-delta-spark-trino, hive-delta-spark-thrift, hive-delta-spark-none
# See docs/recipes.md.
recipe: polaris-iceberg-spark-trino

# ============================================================================
# IMAGES
# ============================================================================
# Container images for every component. Override for private registries.
# See docs/datagen-custom-images.md for building your own datagen image.
# images:
#   datagen: docker.io/sillidata/lb-datagen:3cb67f92@sha256:e1e37d43682f87378b27ea9ff33a2a74885350c76b48caacd9709199c0be83b9    # tag and digest; :latest is not accepted
#   spark: apache/spark:4.0.2-python3
#   postgres: postgres:17
#   trino: trinodb/trino:483
#   polaris: apache/polaris:1.6.0                      # 1.3.0+ has the FlashBlade STS fix; 1.6.0 is current
#   polaris_admin_tool: apache/polaris-admin-tool:1.6.0
#   duckdb: python:3.11-slim
#   jmx_exporter: bitnami/jmx-exporter:latest
#   pull_policy: Always                                # Always | IfNotPresent | Never
#   # Prometheus and Grafana images are NOT set here. Their versions come
#   # from observability.chart_version (kube-prometheus-stack).

# ============================================================================
# LAYER 1: PLATFORM
# ============================================================================
platform:
  kubernetes:
    # context: ""                    # Empty = use current kubectl context
    namespace: ""                    # Empty = use the deployment name
    # create_namespace: true

  storage:
    s3:
      # REQUIRED: S3-compatible endpoint URL
      # Examples:
      #   FlashBlade (HTTP):  http://your-s3-endpoint:80
      #   FlashBlade (HTTPS): https://your-s3-endpoint:443
      #   MinIO:              http://minio:9000
      #   AWS S3:             https://s3.us-east-1.amazonaws.com
      endpoint: ""

      # REQUIRED: S3 credentials, inline (environment substitution keeps them out of the file)
      access_key: ""
      secret_key: ""

      # region: us-east-1
      # path_style: true             # true for FlashBlade/MinIO, false for AWS S3
      # buckets:                     # unset = derived from `name`: <name>-bronze etc.
      #   bronze: my-lakehouse-bronze
      #   silver: my-lakehouse-silver
      #   gold:   my-lakehouse-gold
      # create_buckets: true

      ## TLS settings (for HTTPS endpoints)
      # ca_cert: ""                  # Path to PEM CA cert for self-signed CAs
      #                              # (e.g. FlashBlade). Empty = system CAs.
      # verify_ssl: true             # false skips SSL verification (dev only)

    ## Scratch storage for Spark shuffle PVCs
    ## When enabled, Spark shuffle uses PVCs instead of emptyDir.
    ## Any StorageClass that provides RWO volumes works (Portworx, local-path, EBS, etc.).
    # scratch:
    #   enabled: false
    #   storage_class: px-csi-scratch    # Name of the StorageClass to use. A cluster
    #                                    # admin installs it once with
    #                                    # `lakebench admin install-scratch-storage-class`.
    #                                    # Each executor's PVC size is its job profile's.
    #   provisioner: pxd.portworx.com    # CSI provisioner. Examples:
    #                                    #   pxd.portworx.com (Portworx)
    #                                    #   rancher.io/local-path (local-path)
    #                                    #   ebs.csi.aws.com (AWS EBS)
    #   parameters:                      # Provider-specific parameters
    #     repl: "1"
    #     io_profile: auto
    #     priority_io: high

  # compute:
  #   spark:
  #     operator:                    # Deploy never installs it; a cluster admin
  #                                  # runs `lakebench admin install --component
  #                                  # spark-operator` once per cluster.
  #       namespace: spark-operator
  #       version: "2.5.1"           # Chart a fresh admin install uses
  #
  #     ## Per-executor sizing (cores, memory, overhead, scratch PVC) is fixed
  #     ## in the job profiles, proven at 1 TB+ scale.
  #     ## Per-job executor count overrides (null = auto from scale factor).
  #     ## Per-executor sizing (cores, memory, PVC) stays fixed from the proven profiles.
  #     # bronze_executors: null
  #     # silver_executors: null
  #     # gold_executors: null
  #     ## Continuous-mode job executor overrides
  #     # bronze_ingest_executors: null
  #     # silver_stream_executors: null
  #     # gold_refresh_executors: null
  #     ## Global driver resource overrides
  #     # driver_memory: "8g"
  #     # driver_cores: 4
  #
  #   postgres:
  #     storage: 10Gi
  #     # storage_class: ""           # Empty = cluster default

# ============================================================================
# LAYER 2: DATA ARCHITECTURE
# ============================================================================
# See docs/recipes.md for supported (catalog, table_format, engine, query_engine)
# combinations and guidance.
architecture:
  # pipeline_engine: spark           # Only Spark is supported today
  catalog:
    type: polaris                    # hive | polaris | none
    ## Polaris REST catalog settings (used when type: polaris)
    polaris:
      # Optional. Unset, deploy generates an OAuth2 client secret for this
      # deployment and stores it in the Secret lakebench-polaris-client,
      # where run and destroy read it. To choose your own, set client_secret
      # through env-var substitution (LAKEBENCH_POLARIS_CLIENT_SECRET) so the
      # secret stays out of the file; see docs/component-polaris.md.
      port: 8181
      # resources:
      #   cpu: "1"
      #   memory: 2Gi
    ## Hive Metastore tuning (uncomment when catalog.type: hive)
    # hive:
    #   operator:                    # Deploy never installs them; a cluster admin
    #                                # runs `lakebench admin install --component
    #                                # stackable` once per cluster.
    #     namespace: stackable
    #     version: "25.7.0"          # SDP a fresh admin install uses
    #   resources:
    #     cpu_min: 500m
    #     cpu_max: "2"
    #     memory: 4Gi

  # table_format:
  #   type: iceberg                  # iceberg | delta
  #   iceberg:
  #     version: "1.11.0"            # 1.11+ is the first release with a Spark 4.1 runtime and Java 17

  # query_engine:
  #   type: trino                    # trino | spark-thrift | duckdb | none
  #   trino:
  #     coordinator:
  #       cpu: "2"
  #       memory: 8Gi
  #     worker:
  #       replicas: 2
  #       cpu: "4"
  #       memory: 16Gi
  #       spill_enabled: true
  #       spill_max_per_node: 40Gi
  #       storage: 50Gi
  #       storage_class: ""          # Empty = emptyDir (ephemeral). Name a class for a PVC.
  #     catalog_name: lakehouse      # Trino catalog name for Iceberg
  #   # spark_thrift:                # Spark Thrift Server (alternative to Trino)
  #   #   cores: 2
  #   #   memory: 4g
  #   # duckdb:                      # DuckDB (lightweight in-process engine)
  #   #   cores: 2
  #   #   memory: 4g
  #   #   catalog_name: lakehouse

  pipeline:
    mode: batch                      # batch | continuous
  #   pattern: medallion             # medallion (streaming/batch/custom are deprecated)
  #   cycles: 1                      # Batch iterations (1 = full overwrite; 2..N = append/merge)
  #   pre_benchmark_maintenance: true
  #   ## Continuous pipeline settings (used when mode: continuous)
  #   continuous:
  #     bronze_trigger_interval: "30 seconds"
  #     silver_trigger_interval: "60 seconds"
  #     gold_refresh_interval: "5 minutes"
  #     run_duration: 1800           # Continuous run duration in seconds
  #     checkpoint_base: checkpoints # S3 prefix for checkpoint data
  #     ## Throughput tuning
  #     max_files_per_trigger: 50    # Max Parquet files per micro-batch
  #     bronze_target_file_size_mb: 512
  #     silver_target_file_size_mb: 512
  #     gold_target_file_size_mb: 128
  #     ## Iceberg retention (periodic expire_snapshots + remove_orphan_files)
  #     retention_interval: 600      # Seconds between maintenance rounds (300..7200; unset = run_duration / 3)
  #     retention_threshold: 30m     # Snapshot age to retain (30m, 1h, 7d)
  #     ## In-run benchmark rounds (runs Trino queries while continuous jobs execute)
  #     benchmark_interval: 300      # Seconds between rounds (300..3600)
  #     benchmark_warmup: 300        # Seconds before first round (300..1800)

  ## Benchmark configuration
  ## Runs analytical SQL queries against silver/gold tables via the configured
  ## query engine (Trino, Spark Thrift or DuckDB). See docs/benchmarking.md.
  # benchmark:
  #   mode: power                    # power: single sequential stream (per-query latency)
  #                                  # throughput: N concurrent streams (aggregate QpH)
  #                                  # composite: geometric mean of power + throughput
  #                                  # `lakebench run` measures power only and refuses
  #                                  # throughput, composite, cache: cold and streams
  #                                  # above 1; `lakebench benchmark` runs them all.
  #   streams: 4                     # Concurrent streams (lakebench benchmark only)
  #   cache: hot                     # hot | cold (lakebench benchmark --cold)
  #   iterations: 3                  # Timed runs of each query. Median is used; 1 = quick run with no spread

  ## Table name overrides (namespace.table format)
  # tables:
  #   bronze: default.bronze_raw
  #   silver: silver.customer_interactions_enriched
  #   gold: gold.customer_executive_dashboard

# ============================================================================
# WORKLOAD
# ============================================================================
# Top-level `workload:` is the canonical location (D12). Old configs that
# still nest this under `architecture.workload:` are accepted with a
# DeprecationWarning and will be removed in a future release.
workload:
  # schema: customer360              # customer360 | financial
  datagen:
    # Image comes from images.datagen (see docs/datagen-custom-images.md)
    ## Scale is per-schema:
    ##   customer360: ~10 GB bronze / unit (~100,000 customers)
    ##   financial:   ~8.4 GB bronze / unit (~111,111 entities and their
    ##                accounts + 60 months of pacs.008 transactions)
    scale: 10                        # Interpreted per-schema; see above
    # mode: auto                     # S3 delivery pattern: auto | batch | continuous
    ##   batch:      one PUT per Parquet file (bursty upload, higher peak RSS)
    ##   continuous: S3 multipart upload as row-groups close
    ##   auto:       resolves to continuous (owner D18, 2026-09-28)
    ## Row content is byte-identical across modes at a fixed seed. CPU/memory
    ## are sized by scale via the autosizer independently of mode, and any
    ## cpu/memory you set are honoured.
    parallelism: 1                   # Number of datagen pods
    # file_size: 64mb
    # dirty_data_ratio: 0.08         # customer360 only; financial ignores it
    # generators: 0                  # Per-pod generator threads (0 = auto: follow pod CPU)
    ## Timestamp range for generated event_timestamp values.
    ## Silver partitions by interaction_date (from event_timestamp).
    ## Wide ranges (years) cause small-file proliferation in continuous
    ## mode because each micro-batch writes tiny files across many date
    ## partitions. Continuous: use a narrow range (days/weeks). Batch:
    ## wider is fine.
    # timestamp_start: "2024-01-01"
    # timestamp_end: "2025-01-01"    # exclusive
  ## Customer360 workload overrides
  # customer360:
  #   unique_customers: null         # Override: derived from scale if null

# ============================================================================
# LAYER 3: OBSERVABILITY
# ============================================================================
# Flat schema -- use top-level keys directly under observability:
# observability:
#   enabled: false                   # Deploy kube-prometheus-stack (Prometheus + Grafana)
#   dashboards_enabled: true         # Grafana dashboards
#   retention: 7d                    # Prometheus data retention
#   storage: 10Gi                    # Prometheus PVC size
#   chart_version: "87.19.2"         # kube-prometheus-stack Helm chart version
#   pushgateway_enabled: true        # Per-deployment Pushgateway for live datagen metrics
#   pushgateway_image: prom/pushgateway:v1.11.1
#   pushgateway_storage: 1Gi
#   pushgateway_storage_class: px-csi-scratch

# ============================================================================
# SPARK CONFIGURATION OVERRIDES
# ============================================================================
# Your own Spark keys, merged over the job defaults (each a key=value under
# conf). Keys Lakebench sets for every job (shuffle partitions, the S3A
# connection pool, catalog, jars, UI) are refused. The job defaults:
# spark:
#   conf:
#     spark.hadoop.fs.s3a.multipart.size: "268435456"
#     spark.hadoop.fs.s3a.fast.upload.active.blocks: "16"
#     spark.hadoop.fs.s3a.attempts.maximum: "20"
#     spark.hadoop.fs.s3a.retry.limit: "10"
#     spark.hadoop.fs.s3a.retry.interval: "500ms"
#     spark.memory.fraction: "0.8"
#     spark.memory.storageFraction: "0.3"
