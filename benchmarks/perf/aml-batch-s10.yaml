# Pinned performance config: AML (financial schema), batch, scale 10.
#
# This file is a performance baseline contract, not an example. Every sizing
# knob is set explicitly so a run of this file on the reference cluster is
# comparable with its accepted baseline in baselines.yaml. The gate hashes the
# parsed contents of this file; editing any value (not a comment) invalidates
# the baseline and the gate refuses to compare until a new one is recorded.
# See docs/perf-regression-gate.md.
#
# The AML point of the v1.7 re-baseline, on the default Hive recipe and the
# Spark minor the release matrix runs AML batch scale 10 on, with the
# development seed 43 the release matrix's AML rows use. The datagen image is
# the tree's default image (a test holds them equal); when the default moves
# to the release image, the pins move with it before anything is recorded.
#
# Run it as-is. Identity and credentials come from the environment:
#   LAKEBENCH_PERF_NAME, LAKEBENCH_S3_ENDPOINT, LAKEBENCH_S3_ACCESS_KEY,
#   LAKEBENCH_S3_SECRET_KEY.

name: ${LAKEBENCH_PERF_NAME:-perf-aml-batch-s10}
recipe: hive-iceberg-spark-trino

images:
  datagen: docker.io/sillidata/lb-datagen:2a36ae21@sha256:0502b700299948f43bb1b999d7ba29262a509306658b4e5f7c48738f88d31f04
  spark: apache/spark:4.1.1-python3
  postgres: postgres:17
  trino: trinodb/trino:483
  pull_policy: Always

platform:
  kubernetes:
    namespace: ${LAKEBENCH_PERF_NAME:-perf-aml-batch-s10}
    create_namespace: true

  storage:
    s3:
      endpoint: ${LAKEBENCH_S3_ENDPOINT}
      region: us-east-1
      path_style: true
      access_key: ${LAKEBENCH_S3_ACCESS_KEY}
      secret_key: ${LAKEBENCH_S3_SECRET_KEY}
      buckets:
        bronze: ${LAKEBENCH_PERF_NAME:-perf-aml-batch-s10}-bronze
        silver: ${LAKEBENCH_PERF_NAME:-perf-aml-batch-s10}-silver
        gold: ${LAKEBENCH_PERF_NAME:-perf-aml-batch-s10}-gold
    scratch:
      enabled: true
      storage_class: px-csi-scratch

  compute:
    postgres:
      storage: 10Gi
      storage_class: px-csi-db
    spark:
      # Per-job executor counts, equal to the scale-10 auto values today
      # (get_executor_count with schema financial).
      bronze_executors: 4
      silver_executors: 8
      gold_executors: 4

architecture:
  pipeline:
    mode: batch
    # Maintenance settings are part of the gate fingerprint; pinned here.
    pre_benchmark_maintenance: true

  workload:
    schema: financial
    datagen:
      scale: 10
      mode: batch
      seed: 43
      parallelism: 4
      cpu: "8"
      generators: 0
      file_size: 64mb
      timestamp_start: "2024-01-01"
      timestamp_end: "2025-01-01"

  query_engine:
    type: trino
    trino:
      coordinator:
        cpu: "2"
        memory: 8Gi
      worker:
        replicas: 2
        cpu: "4"
        memory: 16Gi
        spill_enabled: true
        spill_max_per_node: 40Gi
        storage: 50Gi
        storage_class: ""

  benchmark:
    mode: power
    cache: hot
    # Median of 3 timed runs per query; a run with a different sample count
    # is refused by the gate.
    iterations: 3
