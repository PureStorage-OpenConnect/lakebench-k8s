# Pinned performance config: Customer 360, batch, scale 10, Polaris catalog.
#
# This file is a performance baseline contract, not an example. Every sizing
# knob is set explicitly so a run of this file on the reference cluster is
# comparable with its accepted baseline in baselines.yaml. The gate hashes the
# parsed contents of this file; editing any value (not a comment) invalidates
# the baseline and the gate refuses to compare until a new one is recorded.
# See docs/perf-regression-gate.md.
#
# The Customer 360 Hive pin (c360-batch-s10.yaml) with the Polaris catalog:
# every other value is the same, so the two runs form a pair that differs
# in the catalog only. The Polaris client secret is generated per
# deployment by deploy.
#
# The datagen image is the tree's default image (a test holds them equal);
# the seed is 42, the release matrix's Customer 360 seed. Spark is 4.0 on
# both this pin and its twin, so the Hive side is outside the release
# matrix's versions (Hive rows run Spark 4.1) and reads unverified there.
#
# Run it as-is. Identity and credentials come from the environment so the
# file itself never changes between runs:
#   LAKEBENCH_PERF_NAME      deployment name / namespace (default below)
#   LAKEBENCH_S3_ENDPOINT, LAKEBENCH_S3_ACCESS_KEY, LAKEBENCH_S3_SECRET_KEY

name: ${LAKEBENCH_PERF_NAME:-perf-c360-batch-s10-polaris}
recipe: polaris-iceberg-spark-trino

images:
  datagen: docker.io/sillidata/lb-datagen:1.6.0
  spark: apache/spark:4.0.2-python3
  postgres: postgres:17
  polaris: apache/polaris:1.6.0
  polaris_admin_tool: apache/polaris-admin-tool:1.6.0
  trino: trinodb/trino:483
  pull_policy: Always

platform:
  kubernetes:
    namespace: ${LAKEBENCH_PERF_NAME:-perf-c360-batch-s10-polaris}
    create_namespace: true

  storage:
    s3:
      endpoint: ${LAKEBENCH_S3_ENDPOINT}
      region: us-east-1
      path_style: true
      access_key: ${LAKEBENCH_S3_ACCESS_KEY}
      secret_key: ${LAKEBENCH_S3_SECRET_KEY}
      buckets:
        bronze: ${LAKEBENCH_PERF_NAME:-perf-c360-batch-s10-polaris}-bronze
        silver: ${LAKEBENCH_PERF_NAME:-perf-c360-batch-s10-polaris}-silver
        gold: ${LAKEBENCH_PERF_NAME:-perf-c360-batch-s10-polaris}-gold
    scratch:
      enabled: true
      storage_class: px-csi-scratch

  compute:
    postgres:
      storage: 10Gi
      storage_class: px-csi-db
    spark:
      # Per-job executor counts, equal to the scale-10 auto values today
      # (get_executor_count). Pinned so a profile change shows up as a
      # config change, not as a performance change.
      bronze_executors: 4
      silver_executors: 8
      gold_executors: 4

architecture:
  catalog:
    type: polaris

  pipeline:
    mode: batch
    # Maintenance settings are part of the gate fingerprint; pinned here.
    pre_benchmark_maintenance: true

  workload:
    schema: customer360
    datagen:
      scale: 10
      mode: batch
      seed: 42
      parallelism: 4
      cpu: "8"
      generators: 0
      file_size: 64mb
      timestamp_start: "2024-01-01"
      timestamp_end: "2025-01-01"

  query_engine:
    type: trino
    trino:
      coordinator:
        cpu: "2"
        memory: 8Gi
      worker:
        replicas: 2
        cpu: "4"
        memory: 16Gi
        spill_enabled: true
        spill_max_per_node: 40Gi
        storage: 50Gi
        storage_class: ""

  benchmark:
    mode: power
    cache: hot
    # Median of 3 timed runs per query (LB-150); a run with a different
    # sample count is refused by the gate.
    iterations: 3
