# Pinned performance config: Customer 360, continuous, scale 10.
#
# This file is a performance baseline contract, not an example. Every sizing
# knob is set explicitly so a run of this file on the reference cluster is
# comparable with its accepted baseline in baselines.yaml. The gate hashes the
# parsed contents of this file; editing any value (not a comment) invalidates
# the baseline and the gate refuses to compare until a new one is recorded.
# See docs/perf-regression-gate.md.
#
# Run it as-is. Identity and credentials come from the environment so the
# file itself never changes between runs:
#   LAKEBENCH_PERF_NAME      deployment name / namespace (default below)
#   LAKEBENCH_S3_ENDPOINT, LAKEBENCH_S3_ACCESS_KEY, LAKEBENCH_S3_SECRET_KEY

name: ${LAKEBENCH_PERF_NAME:-perf-c360-cont-s10}
recipe: hive-iceberg-spark-trino

images:
  datagen: docker.io/sillidata/lb-datagen:14c4eee
  spark: apache/spark:4.0.2-python3
  postgres: postgres:17
  trino: trinodb/trino:483
  pull_policy: Always

platform:
  kubernetes:
    namespace: ${LAKEBENCH_PERF_NAME:-perf-c360-cont-s10}
    create_namespace: true

  storage:
    s3:
      endpoint: ${LAKEBENCH_S3_ENDPOINT}
      region: us-east-1
      path_style: true
      access_key: ${LAKEBENCH_S3_ACCESS_KEY}
      secret_key: ${LAKEBENCH_S3_SECRET_KEY}
      buckets:
        bronze: ${LAKEBENCH_PERF_NAME:-perf-c360-cont-s10}-bronze
        silver: ${LAKEBENCH_PERF_NAME:-perf-c360-cont-s10}-silver
        gold: ${LAKEBENCH_PERF_NAME:-perf-c360-cont-s10}-gold
    scratch:
      enabled: true
      storage_class: px-csi-scratch
      size: 100Gi

  compute:
    postgres:
      storage: 10Gi
      storage_class: px-csi-db
    spark:
      driver:
        cores: 4
        memory: 8g
      executor:
        instances: 4
        cores: 4
        memory: 16g
        memory_overhead: 4g
      # Per-job executor counts, equal to the scale-10 auto values today
      # (get_executor_count). Pinned so a profile change shows up as a
      # config change, not as a performance change.
      bronze_ingest_executors: 2
      silver_stream_executors: 4
      gold_refresh_executors: 2

architecture:
  pipeline:
    # "sustained" is the config spelling of continuous mode.
    mode: sustained
    sustained:
      bronze_trigger_interval: 30 seconds
      silver_trigger_interval: 60 seconds
      gold_refresh_interval: 5 minutes
      run_duration: 1800
      max_files_per_trigger: 50
      bronze_target_file_size_mb: 512
      silver_target_file_size_mb: 512
      gold_target_file_size_mb: 128
      benchmark_interval: 300
      benchmark_warmup: 300

  workload:
    schema: customer360
    datagen:
      scale: 10
      mode: batch
      parallelism: 4
      cpu: "8"
      generators: 0
      uploaders: 0
      file_size: 64mb
      # Two weeks, not a year: each micro-batch writes into every date
      # partition its rows touch, so a wide range multiplies small files.
      timestamp_start: "2024-12-18"
      timestamp_end: "2025-01-01"

  query_engine:
    type: trino
    trino:
      coordinator:
        cpu: "2"
        memory: 8Gi
      worker:
        replicas: 2
        cpu: "4"
        memory: 16Gi
        spill_enabled: true
        spill_max_per_node: 40Gi
        storage: 50Gi
        storage_class: ""

  benchmark:
    mode: power
    cache: hot
    # In-stream rounds take one sample per query; the rounds are the repeats.
    iterations: 1
    streams: 4
