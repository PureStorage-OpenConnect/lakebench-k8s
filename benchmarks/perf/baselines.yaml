# Accepted performance baselines per pinned config. Written by
# scripts/perf_gate.py record; see docs/perf-regression-gate.md.
schema_version: 1
baselines:
  c360-batch-s10:
    config: c360-batch-s10.yaml
    # Part of the v1.7 re-baseline with its Polaris twin. Its v1.6 entry was
    # poll-timed and named a datagen image that no registry holds; the pin
    # now names the tree's default image and seed 42, so it is re-recorded
    # from its first run on the v1.7 freeze tree. Required from the
    # post-freeze data commit.
    required: false
    status: pending first run
    notes: First recorded on the v1.7 freeze tree.
  c360-continuous-s10:
    config: c360-continuous-s10.yaml
    # Not required for v1.6 (owner decision 2026-09-29): the performance
    # re-baseline moved to v1.7.
    required: false
    status: pending first run
    notes: Previous baseline run 20260925-153533-529c12 (f6c7795) is void as a perf
      reference. It was measured before f63cb38, when no Iceberg expire_snapshots or
      remove_orphan_files statement ever succeeded (LB-174), so it measured a pipeline
      with no snapshot maintenance. Re-record from the first run on the frozen tree.
  aml-batch-s1:
    config: aml-batch-s1.yaml
    required: false
    status: pending first run
    notes: Not required until the AML datagen is frozen. Every AML batch run so far
      records scale_ratio 0.0 (bronze input volume not measured), which the gate refuses;
      that has to be fixed before any AML run can become a baseline.
  aml-batch-s10:
    config: aml-batch-s10.yaml
    # The AML point of the v1.7 re-baseline. Required from the post-freeze
    # data commit that accepts its first baseline (n=1: repetition 1 of a run --repeat 3).
    required: false
    status: pending first run
    notes: First recorded on the v1.7 freeze tree.
  c360-batch-s10-polaris:
    config: c360-batch-s10-polaris.yaml
    # The Polaris twin of c360-batch-s10 (the catalog is the only difference).
    # Required from the post-freeze data commit, like c360-batch-s10.
    required: false
    status: pending first run
    notes: First recorded on the v1.7 freeze tree.
